<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nigel</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdfcfb;
        --fg: #2b2b33;
        --muted: #6b6b7b;
        --card: #ffffff;
        --border: #e6e3f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171d;
          --fg: #ece9f5;
          --muted: #9a97ab;
          --card: #1f1f28;
          --border: #2e2e3c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 34rem;
        margin: 2rem;
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        background: linear-gradient(90deg, #ffb3ba, #ffdfba, #baffc9, #bae1ff, #d8baff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { color: var(--muted); }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
        padding: 0.1em 0.35em;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nigel</h1>
      <p id="placeholder-notice">
        The web UI has not been built yet. Run <code>npm run build</code> in
        <code>web/</code> to replace this placeholder with the application.
      </p>
      <p>
        The server is running and the API is available under <code>/api</code>.
      </p>
    </main>
  </body>
</html>
